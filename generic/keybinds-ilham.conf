# Ilham-style generic Hyprland keybinds
# Portable mode: no Ryoku or Brain Shell required.
# Load this file from hyprland.conf with:
# source = ~/.config/hypr/keybinds-ilham-generic.conf

# Applications and helpers
$ilham_apps = ilham-hypr-app

# Window controls
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bind = SUPER SHIFT, P, pin
bind = SUPER, A, togglefloating
bind = SUPER, R, submap, resize

# Focus
bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d

# Move windows
bind = SUPER SHIFT, LEFT, movewindow, l
bind = SUPER SHIFT, RIGHT, movewindow, r
bind = SUPER SHIFT, UP, movewindow, u
bind = SUPER SHIFT, DOWN, movewindow, d

# Resize windows
bind = SUPER CTRL, LEFT, resizeactive, -40 0
bind = SUPER CTRL, RIGHT, resizeactive, 40 0
bind = SUPER CTRL, UP, resizeactive, 0 -40
bind = SUPER CTRL, DOWN, resizeactive, 0 40

# Applications
bind = SUPER, RETURN, exec, $ilham_apps terminal
bind = SUPER, E, exec, $ilham_apps files
bind = SUPER, B, exec, $ilham_apps browser
bind = SUPER, N, exec, $ilham_apps editor
bind = SUPER, O, exec, $ilham_apps notes
bind = SUPER ALT, E, exec, $ilham_apps yazi

# Launcher / lock / utility
# Current Ilham remap: SUPER+Space -> SUPER+X
bind = SUPER, X, exec, $ilham_apps launcher
bind = SUPER, L, exec, $ilham_apps lock
bind = SUPER, V, exec, $ilham_apps clipboard
bind = SUPER, TAB, exec, $ilham_apps switcher
bind = SUPER SHIFT, C, exec, $ilham_apps picker
bind = SUPER SHIFT, S, exec, $ilham_apps screenshot
bind = PRINT, exec, $ilham_apps screenshot
bind = SHIFT, PRINT, exec, $ilham_apps screenshot-monitor

# Workspaces 1-10
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER ALT, 1, movetoworkspace, 1
bind = SUPER ALT, 2, movetoworkspace, 2
bind = SUPER ALT, 3, movetoworkspace, 3
bind = SUPER ALT, 4, movetoworkspace, 4
bind = SUPER ALT, 5, movetoworkspace, 5
bind = SUPER ALT, 6, movetoworkspace, 6
bind = SUPER ALT, 7, movetoworkspace, 7
bind = SUPER ALT, 8, movetoworkspace, 8
bind = SUPER ALT, 9, movetoworkspace, 9
bind = SUPER ALT, 0, movetoworkspace, 10

bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT, 9, movetoworkspacesilent, 9
bind = SUPER SHIFT, 0, movetoworkspacesilent, 10

# Previous / next workspace
bind = SUPER, mouse_up, workspace, e-1
bind = SUPER, mouse_down, workspace, e+1

# Special workspace
bind = SUPER ALT, H, togglespecialworkspace, scratch
bind = SUPER J, togglespecialworkspace, music

# Mouse window controls
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Audio / media
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness (uses brightnessctl when available)
bindel = , XF86MonBrightnessUp, exec, $ilham_apps brightness-up
bindel = , XF86MonBrightnessDown, exec, $ilham_apps brightness-down

# Resize submap
submap = resize
bind = , LEFT, resizeactive, -40 0
bind = , RIGHT, resizeactive, 40 0
bind = , UP, resizeactive, 0 -40
bind = , DOWN, resizeactive, 0 40
bind = , H, resizeactive, -40 0
bind = , L, resizeactive, 40 0
bind = , K, resizeactive, 0 -40
bind = , J, resizeactive, 0 40
bind = , ESCAPE, submap, reset
bind = , RETURN, submap, reset
bind = SUPER, R, submap, reset
submap = reset
